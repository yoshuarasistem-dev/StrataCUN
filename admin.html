<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÓVEDA MASTER | Strata CUN Operaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-main: #02050e; --bg-card: rgba(11, 20, 43, 0.95); --text-primary: #ffffff; --text-secondary: #94a3b8; --cyan: #3b82f6; --gold: #eab308; --emerald: #10b981; --gray-pending: rgba(148, 163, 184, 0.2); }
        body { background-color: var(--bg-main); color: var(--text-primary); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--bg-card); border-right: 1px solid rgba(59, 130, 246, 0.2); padding: 2rem; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--gold); font-size: 1.1rem; margin-bottom: 2.5rem; letter-spacing: 0.15em; text-transform: uppercase; }
        .nav-item { padding: 1rem 1.2rem; color: var(--text-secondary); text-decoration: none; display: block; border-radius: 12px; margin-bottom: 0.5rem; transition: all 0.3s; font-weight: 600; font-size: 0.9rem; cursor: pointer; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.15); color: var(--cyan); border-left: 4px solid var(--cyan); }
        .main-content { flex: 1; padding: 3rem 4rem; overflow-y: auto; background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent 50%); }
        .header-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 2rem; margin-bottom: 2rem; }
        .stat-card { background: var(--bg-card); padding: 1.5rem; border-radius: 20px; border: 1px solid rgba(59, 130, 246, 0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-card h3 { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2.2rem; font-weight: 800; color: var(--cyan); }
        .table-container { background: var(--bg-card); border-radius: 20px; border: 1px solid rgba(59, 130, 246, 0.15); overflow: hidden; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(59, 130, 246, 0.1); padding: 1rem; color: var(--gold); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: var(--text-primary); }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .status-badge { padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 700; font-size: 0.75rem; display: inline-block; }
        .status-pending { background: var(--gray-pending); color: var(--text-secondary); border: 1px solid rgba(148,163,184,0.3); }
        .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid var(--emerald); }
        .action-btn { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 0.4rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; margin-right: 0.5rem; text-decoration: none;}
        .action-btn:hover { background: var(--cyan); color: #fff; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .admin-input { background: rgba(5, 10, 24, 0.95); border: 1px solid rgba(148, 163, 184, 0.3); color: #fff; padding: 0.8rem 1rem; border-radius: 12px; font-family: inherit; font-size: 0.9rem; width: 100%; margin-top: 0.4rem; }
        .admin-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-btn { background: var(--gold); color: #000; font-weight: 800; border: none; padding: 1rem 2rem; border-radius: 12px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Bóveda Master 🔒</h2>
        <a class="nav-item active" id="btn-monitor" onclick="switchTab('monitor')">📊 Monitor Operativo</a>
        <a class="nav-item" id="btn-partners" onclick="switchTab('partners')">🤝 Partners (Ingreso)</a>
        <a class="nav-item" id="btn-historial" onclick="switchTab('historial')">📋 Histórico / Flota</a>
        <a href="index.html" class="nav-item" style="margin-top: auto; color: #ef4444; border-left: none;">🚪 Salir</a>
    </div>

    <div class="main-content">
        
        <div id="tab-monitor" class="tab-content active">
            <h1 class="header-title">Centro de Control</h1>
            
            <div class="dashboard-grid">
                <div class="stat-card"><h3>Pendientes</h3><div class="value" id="countPending">0</div></div>
                <div class="stat-card"><h3>Completados</h3><div class="value" style="color: var(--emerald);" id="countCompleted">0</div></div>
                <div class="stat-card"><h3>Ingresos</h3><div class="value" style="color: var(--gold);" id="totalRevenue">$0</div></div>
            </div>
            
            <div class="table-container">
                <table>
                    <thead><tr><th>Folio</th><th>Estado</th><th>Cliente</th><th>Servicio</th><th>Vuelo</th><th>Total</th><th>Acciones</th></tr></thead>
                    <tbody id="reservasTableBody"><tr><td colspan="7" style="text-align:center; padding: 2rem;">Cargando Bóveda...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div id="tab-partners" class="tab-content">
            <h1 class="header-title">Módulo de Partners</h1>
            <div style="background: var(--bg-card); border: 1px solid rgba(234, 179, 8, 0.3); padding: 2.5rem; border-radius: 20px;">
                <form id="partnerForm" onsubmit="submitPartnerBooking(event)">
                    <div class="form-grid">
                        <div><label class="admin-label">Agencia / Origen</label><input type="text" id="p-agencia" class="admin-input" required></div>
                        <div><label class="admin-label">Pasajero</label><input type="text" id="p-nombre" class="admin-input" required></div>
                        <div><label class="admin-label">WhatsApp</label><input type="text" id="p-wa" class="admin-input"></div>
                        <div><label class="admin-label">Servicio</label><input type="text" id="p-servicio" class="admin-input" required></div>
                        <div><label class="admin-label">Fecha</label><input type="datetime-local" id="p-fecha" class="admin-input" required></div>
                        <div><label class="admin-label">Total (MXN)</label><input type="text" id="p-total" class="admin-input" required></div>
                    </div>
                    <button type="submit" class="form-btn" style="margin-top:2rem;">Guardar en Base de Datos 💾</button>
                </form>
            </div>
        </div>

        <div id="tab-historial" class="tab-content">
            <h1 class="header-title">Histórico General</h1>
            <div style="text-align: center; padding: 4rem; background: var(--bg-card); border-radius: 20px; border: 1px dashed var(--cyan);">
                <span style="font-size: 3rem;">📊</span><h3 style="margin: 1rem 0;">Matriz de Excel</h3>
                <a href="https://docs.google.com/spreadsheets/d/1ww2AcaXE_9QXyaDRQzUwXen92wZNUhnM_7YOHfH0mco/edit" target="_blank" class="form-btn" style="background: var(--cyan); color: #fff; width: auto;">Abrir Excel Central ✏️</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVA0l-cieOQotyRm9HEtMBxrLOnHFYNfm0x1W6UhB-CHuxqJ6vOjQgc20HeLgH5fteYQ/exec";

        document.addEventListener('DOMContentLoaded', fetchReservations);

        function fetchReservations() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => renderTable(data))
                .catch(() => { document.getElementById('reservasTableBody').innerHTML = `<tr><td colspan="7">Error de red al cargar reservas.</td></tr>`; });
        }

        function renderTable(rows) {
            const tbody = document.getElementById('reservasTableBody');
            tbody.innerHTML = '';
            let pendientes = 0; let completados = 0; let ingresos = 0;

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if(!row[0]) continue; 
                
                const statusTexto = row[2] ? row[2].toLowerCase() : '';
                const isCompleted = statusTexto.includes('completado') || statusTexto.includes('manual');
                const badgeClass = isCompleted ? 'status-completed' : 'status-pending';
                
                if (isCompleted) { completados++; ingresos += parseFloat(row[14]) || 0; } 
                else { pendientes++; ingresos += parseFloat(row[14]) || 0; }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${row[0]}</strong></td>
                    <td><span class="status-badge ${badgeClass}">${row[2]}</span></td>
                    <td>${row[3]}</td><td>${row[6]}</td><td>${row[12]}</td>
                    <td><strong style="color:var(--gold)">$${row[14]}</strong></td>
                    <td><a href="https://docs.google.com/spreadsheets/d/1ww2AcaXE_9QXyaDRQzUwXen92wZNUhnM_7YOHfH0mco/edit" target="_blank" class="action-btn">✏️ Editar</a></td>
                `;
                tbody.prepend(tr); 
            }
            document.getElementById('countPending').textContent = pendientes;
            document.getElementById('countCompleted').textContent = completados;
            document.getElementById('totalRevenue').textContent = `$${new Intl.NumberFormat('es-MX').format(ingresos)}`;
        }

        function submitPartnerBooking(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.form-btn');
            btn.innerHTML = 'Guardando... ⏳';
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('origen', 'partner_manual');
            formData.append('agencia', document.getElementById('p-agencia').value);
            formData.append('nombre', document.getElementById('p-nombre').value);
            formData.append('whatsapp', document.getElementById('p-wa').value);
            formData.append('servicio', document.getElementById('p-servicio').value);
            formData.append('fecha', document.getElementById('p-fecha').value);
            formData.append('total', document.getElementById('p-total').value);

            // Fetch en modo seguro (no-cors) para forzar guardado sin depender del JSON de respuesta
            fetch(SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' })
            .then(() => {
                alert("✅ Registro de Partner guardado exitosamente.");
                e.target.reset();
                setTimeout(fetchReservations, 1000);
            })
            .catch(() => alert("✅ Enviado (Verifica en Excel)"))
            .finally(() => {
                btn.innerHTML = 'Guardar en Base de Datos 💾';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
